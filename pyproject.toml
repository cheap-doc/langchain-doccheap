[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langchain-doccheap"
version = "0.1.0"
description = "LangChain tools for doc.cheap: read passports, ID cards and driver's licences into JSON."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Teoh Chin Heng", email = "admin@doc.cheap" }]
keywords = ["langchain", "tools", "ocr", "passport", "id-card", "mrz", "document-recognition", "kyc", "doc.cheap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["doc-cheap>=0.1.0,<1", "langchain-core>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "langchain-tests>=1.0,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "langchain-tests>=1.0,<2", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://doc.cheap"
Documentation = "https://doc.cheap/docs"
Source = "https://gitlab.com/doccheap/langchain-doccheap"
Changelog = "https://gitlab.com/doccheap/langchain-doccheap/-/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_doccheap"]

[tool.hatch.build.targets.sdist]
include = ["src/langchain_doccheap", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["langchain_doccheap"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["langchain_doccheap"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
